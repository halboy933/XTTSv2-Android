name: Build XTTS Android APK

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.XTTS_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/xtts-release.jks"

      - name: Verify signing keystore
        env:
          XTTS_KEYSTORE_PASSWORD: ${{ secrets.XTTS_KEYSTORE_PASSWORD }}
        run: |
          test -s "$RUNNER_TEMP/xtts-release.jks"
          keytool -list \
            -keystore "$RUNNER_TEMP/xtts-release.jks" \
            -storepass "$XTTS_KEYSTORE_PASSWORD"

      - name: Build release APK
        env:
          XTTS_KEYSTORE_PATH: ${{ runner.temp }}/xtts-release.jks
          XTTS_KEYSTORE_PASSWORD: ${{ secrets.XTTS_KEYSTORE_PASSWORD }}
          XTTS_KEY_ALIAS: xtts
          XTTS_KEY_PASSWORD: ${{ secrets.XTTS_KEY_PASSWORD }}
        run: gradle :app:assembleRelease

      - name: Verify release APK package and signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          BT="$ANDROID_HOME/build-tools/36.0.0"

          test -s "$APK"

          echo "=== APK file ==="
          ls -lh "$APK"
          file "$APK"
          sha256sum "$APK"

          echo "=== ZIP alignment ==="
          "$BT/zipalign" -c -v 4 "$APK"

          echo "=== APK signature ==="
          "$BT/apksigner" verify --verbose --print-certs "$APK"

          echo "=== Package metadata ==="
          "$BT/aapt" dump badging "$APK" | head -n 20

      - name: Copy verified APK with explicit name
        run: |
          cp app/build/outputs/apk/release/app-release.apk              app/build/outputs/apk/release/XTTSv2-Android-verified.apk


      - uses: actions/upload-artifact@v4
        with:
          name: XTTSv2-Android-VERIFIED
          path: app/build/outputs/apk/release/XTTSv2-Android-verified.apk
          if-no-files-found: error
